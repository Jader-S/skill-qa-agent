[package]
name = "skill-qa-agent"
version = "0.1.0"
description = "技能问答 Agent - 前端/全栈/AI 应用自测工具"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
